services:
  postgres:
    image: postgres:17
    container_name: ai_support_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_support

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: ai_support_api
    restart: unless-stopped

    depends_on:
      - postgres

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ai_support
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: gpt-5-nano

    ports:
      - "8000:8000"

    volumes:
      # Persist the local Chroma index between container recreations.
      - rag_vector_store:/app/app/rag/vector_store

volumes:
  postgres_data:
  rag_vector_store:
