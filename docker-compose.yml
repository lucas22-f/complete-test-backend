services:
  postgres:
    image: postgres:17
    container_name: ai_support_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_support

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: ai_support_api
    restart: unless-stopped

    depends_on:
      - postgres

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ai_support
      SECRET_KEY: una-clave-larga-y-segura
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

    ports:
      - "8000:8000"

volumes:
  postgres_data: